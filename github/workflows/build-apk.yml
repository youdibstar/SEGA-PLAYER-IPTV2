name: Build SEGA IPTV APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        working-directory: android
        env:
          SEGA_BACKEND_URL: ${{ vars.SEGA_IPTV_BACKEND_URL }}
        run: |
          if [ -n "$SEGA_BACKEND_URL" ]; then
            gradle :app:assembleDebug "-PSEGA_IPTV_BACKEND_URL=$SEGA_BACKEND_URL"
          else
            gradle :app:assembleDebug
          fi
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SEGA-IPTV-Player-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
