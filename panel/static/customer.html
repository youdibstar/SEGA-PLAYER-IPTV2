<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEGA PLAYER | Espace Client</title><style>body{background:#111827;color:#f9fafb;font:16px system-ui;margin:0;padding:24px}main{max-width:720px;margin:35px auto;background:#1f2937;border-radius:18px;padding:28px}h1{color:#f87171}input,button{box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid #4b5563;font:inherit}input{width:100%;background:#111827;color:white;margin:7px 0 15px}button{background:#dc2626;color:white;cursor:pointer;border:0;margin:5px}button.secondary{background:#374151}article{border:1px solid #4b5563;border-radius:10px;padding:12px;margin:12px 0;overflow-wrap:anywhere}small{color:#9ca3af}#error{color:#fca5a5}label{display:block}a{color:#93c5fd}</style></head><body><main><h1>▶ SEGA PLAYER IPTV</h1><p>بوابة الزبون — إدارة قوائم M3U الخاصة بجهازك</p><section id="login"><form id="loginForm"><label>MAC Address<input id="mac" required pattern="[A-Fa-f0-9]{2}(:[A-Fa-f0-9]{2}){5}" placeholder="AA:BB:CC:DD:EE:FF" dir="ltr"></label><label>DeviceKey<input id="key" required placeholder="A7B9C2" dir="ltr"></label><button>تسجيل الدخول</button></form></section><section id="panel" hidden><p id="status"></p><button class="secondary" id="logout">تسجيل الخروج</button><h2>قوائمي</h2><div id="lists"></div><h2 id="formTitle">إضافة قائمة</h2><form id="playlistForm"><label>اسم القائمة<input id="name" maxlength="100" required></label><label>رابط M3U<input id="url" type="url" maxlength="3000" required placeholder="https://example.com/list.m3u" dir="ltr"></label><button id="save">حفظ القائمة</button><button type="button" class="secondary" id="cancel">إلغاء التعديل</button></form></section><p id="error" role="alert"></p><small>يمكنك إدارة قوائمك حتى بعد انتهاء التفعيل، لكن تشغيل القنوات يتطلب اشتراكاً نشطاً.</small></main><script>
let token='',editing=null,items=[];const $=id=>document.getElementById(id);const error=e=>$('error').textContent=e||'';
async function api(path,method='GET',body){const r=await fetch('/customer/api/'+path,{method,headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.detail||'تعذر إتمام العملية');return data}
function clearEdit(){editing=null;$('playlistForm').reset();$('formTitle').textContent='إضافة قائمة'}
async function refresh(){const data=await api('playlists');items=data.playlists;$('status').textContent='حالة الجهاز: '+(data.device.active?'مفعّل':'غير مفعّل')+' | انتهاء التفعيل: '+(data.device.expires_at||'غير محدد');$('lists').replaceChildren();for(const p of items){const card=document.createElement('article');const title=document.createElement('strong');title.textContent=p.name;const url=document.createElement('p');url.textContent=p.url;const edit=document.createElement('button');edit.textContent='تعديل';edit.onclick=()=>{editing=p.id;$('name').value=p.name;$('url').value=p.url;$('formTitle').textContent='تعديل القائمة'};const del=document.createElement('button');del.textContent='حذف';del.onclick=async()=>{if(!confirm('حذف القائمة؟'))return;try{await api('playlists/'+p.id,'DELETE');await refresh()}catch(e){error(e.message)}};card.append(title,url,edit,del);$('lists').append(card)}}
$('loginForm').onsubmit=async e=>{e.preventDefault();error('');try{const d=await api('login','POST',{mac_alias:$('mac').value.toUpperCase(),device_key:$('key').value});token=d.token;$('login').hidden=true;$('panel').hidden=false;await refresh()}catch(e){error(e.message)}};
$('playlistForm').onsubmit=async e=>{e.preventDefault();error('');try{await api('playlists'+(editing?'/'+editing:''),editing?'PUT':'POST',{name:$('name').value,url:$('url').value});clearEdit();await refresh()}catch(e){error(e.message)}};
$('cancel').onclick=clearEdit;$('logout').onclick=()=>{token='';$('panel').hidden=true;$('login').hidden=false;clearEdit();error('')};
</script></body></html>
